function deletePo(id) {
  if (!confirm("Delete this PO?")) return;
  state.pos = state.pos.filter(p => p.id !== id);
  save(); renderPos(); toast("PO deleted", "warn");
}
function toggleConfirm(id) {
  const p = state.pos.find(x => x.id === id);
  p.confirmed = !p.confirmed;
  p.deliveredDate = p.confirmed ? todayStr() : "";
  save(); renderPos();
  toast(p.confirmed ? `${p.po} marked delivered` : `${p.po} delivery unconfirmed`, p.confirmed ? "" : "warn");
}

function renderPos() {
  const q = ui.poSearch.toLowerCase();
  const showDelivered = document.getElementById("showDeliveredPos").checked;
  let rows = state.pos.filter(p => {
    if (!showDelivered && p.confirmed) return false;
    if (ui.poFilter === "Overdue" && !(p.estDelivery && !p.confirmed && daysUntil(p.estDelivery) < 0)) return false;
    if (ui.poFilter === "Pending" && p.confirmed) return false;
    if (ui.poFilter === "Delivered" && !p.confirmed) return false;
    return !q || (p.po + " " + p.vendor + " " + p.items + " " + p.notes).toLowerCase().includes(q);
  });
  rows.sort((a, b) => cmp(a, b, ui.poSortKey, ui.poSortDir));

  const overdueN = state.pos.filter(p => p.estDelivery && !p.confirmed && daysUntil(p.estDelivery) < 0).length;
  document.getElementById("poFilterChips").innerHTML = ["All", "Pending", "Overdue", "Delivered"].map(f =>
    `<button class="chip ${ui.poFilter === f ? "active" : ""}" onclick="ui.poFilter='${f}';renderPos()">${f}${f === "Overdue" && overdueN ? " · " + overdueN : ""}</button>`
  ).join("");

  const wrap = document.getElementById("posTableWrap");
  if (!rows.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="big">🧾</div>No purchase orders match. Add one with <b>＋ New PO</b>.</div>`;
  } else {
    wrap.innerHTML = `<table class="data"><thead><tr>
      ${th("po", "po", "PO #")}${th("po", "vendor", "Vendor")}${th("po", "items", "Items")}${th("po", "orderDate", "Order Date")}${th("po", "estDelivery", "Est. Delivery")}${th("po", "confirmed", "Delivery")}<th style="cursor:default"></th>
    </tr></thead><tbody>
    ${rows.map(p => {
      const late = p.estDelivery && !p.confirmed && daysUntil(p.estDelivery) < 0;
      return `<tr data-id="${p.id}">
        <td class="mono"><b>${esc(p.po)}</b></td>
        <td>${esc(p.vendor) || "—"}</td>
        <td>${esc(p.items) || "—"}${p.notes ? `<span class="sub">${esc(p.notes)}</span>` : ""}</td>
        <td>${fmtDate(p.orderDate)}</td>
        <td>${p.confirmed ? fmtDate(p.estDelivery) : (dueBadge(p.estDelivery, false) || "—")}</td>
        <td><button class="conf-toggle ${p.confirmed ? "on" : ""}" onclick="toggleConfirm('${p.id}')" title="Click to toggle delivery confirmation">
          ${p.confirmed ? "✓ Delivered " + fmtDate(p.deliveredDate) : (late ? "⚠ Awaiting (late)" : "○ Awaiting")}
        </button></td>
        <td><div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
          ${refBadge("po", p.id)}
          <div class="row-actions">
            <button class="icon-btn" title="Edit" onclick="openPoModal('${p.id}')">✎</button>
            <button class="icon-btn" title="Delete" onclick="deletePo('${p.id}')">🗑</button>
          </div>
        </div></td>
      </tr>`;
    }).join("")}
    </tbody></table>`;
  }
  const pending = state.pos.filter(p => !p.confirmed);
  document.getElementById("cnt-pos").textContent = pending.length;
  document.getElementById("poStats").innerHTML =
    `<div class="stat"><b>${pending.length}</b> pending</div>` +
    (overdueN ? `<div class="stat" style="border-color:var(--red)"><b style="color:var(--red)">${overdueN}</b> overdue</div>` : "");
}

/* =====================================================================
   SCOPES OF WORK
   ===================================================================== */
const SOW_STATUSES = ["Open", "Closed"];
const SOW_COLORS = { "Open": "var(--accent-text)", "Closed": "var(--text-faint)" };

/* elapsed time a scope has been open — live while Open, frozen once Closed */
function sowStartMs(s) {
  return s.start ? new Date(s.start + "T00:00:00").getTime() : (s.created || Date.now());
}
function sowElapsedMs(s) {
  const end = s.status === "Closed" ? (s.closedAt || Date.now()) : Date.now();
  return Math.max(0, end - sowStartMs(s));
}
function fmtElapsed(ms) {
  const t = Math.floor(ms / 1000);
  const d = Math.floor(t / 86400), h = Math.floor((t % 86400) / 3600),
        m = Math.floor((t % 3600) / 60), sec = t % 60;
  const p = n => String(n).padStart(2, "0");
  return (d ? d + "d " : "") + p(h) + ":" + p(m) + ":" + p(sec);
}
function tickSowTimers() {
  document.querySelectorAll('.sow-timer[data-live="1"]').forEach(el => {
    el.querySelector(".t").textContent = fmtElapsed(Date.now() - Number(el.dataset.start));
  });
}
setInterval(tickSowTimers, 1000);
function sows() { return state.sows || (state.sows = []); }
function initials(s) {
  const p = String(s || "").trim().split(/\s+/).filter(Boolean);
  return p.length ? (p[0][0] + (p[1] ? p[1][0] : "")).toUpperCase() : "?";
}
/* elapsed-time progress between start and target */
function sowProgress(s) {
  if (s.status === "Closed") return 100;
  if (!s.start || !s.target) return null;
  const a = new Date(s.start + "T00:00:00"), b = new Date(s.target + "T00:00:00"), now = new Date(todayStr() + "T00:00:00");
  if (b <= a) return null;
  return Math.max(0, Math.min(100, Math.round((now - a) / (b - a) * 100)));
}

function openSowModal(id) {
  editingId = id || null;
  const s = id ? sows().find(x => x.id === id)
    : { number: "", title: "", client: "", desc: "", status: "Open", start: todayStr(), target: "", owner: "" };
  openModal(id ? "Edit Scope of Work" : "New Scope of Work", `
    <div class="field-row">
      ${fld("SOW #", `<input id="f_num" value="${esc(s.number)}" placeholder="SOW-0000">`)}
      ${fld("Status", `<select id="f_sstatus">${selOpts(SOW_STATUSES, s.status)}</select>`)}
    </div>
    ${fld("Title", `<input id="f_title" value="${esc(s.title)}" placeholder="Scope title">`)}
    <div class="field-row">
      ${fld("Client / customer", `<input id="f_client" value="${esc(s.client)}" placeholder="Who it's for">`)}
      ${fld("Owner", `<input id="f_owner" value="${esc(s.owner)}" placeholder="Responsible person">`)}
    </div>
    ${fld("Scope description", `<textarea id="f_desc" placeholder="What's in scope…">${esc(s.desc)}</textarea>`)}
    <div class="field-row">
      ${fld("Start date", `<input type="date" id="f_start" value="${esc(s.start)}">`)}
      ${fld("Target completion", `<input type="date" id="f_target" value="${esc(s.target)}">`)}
    </div>
  `, () => {
    const title = val("f_title");
    if (!title) { toast("Title is required", "warn"); return false; }
    const data = {
      number: val("f_num"), title, client: val("f_client"), owner: val("f_owner"),
      desc: val("f_desc"), status: val("f_sstatus"), start: val("f_start"), target: val("f_target"),
    };
    if (editingId) {
      const cur = sows().find(x => x.id === editingId);
      if (data.status === "Closed" && cur.status !== "Closed") data.closedAt = Date.now();
      if (data.status === "Open") data.closedAt = null;
      Object.assign(cur, data);
    } else {
      sows().push({ id: uid(), created: Date.now(), closedAt: data.status === "Closed" ? Date.now() : null, ...data });
    }
    save(); renderSows(); toast(editingId ? "Scope updated" : "Scope of work added");
  });
}
function deleteSow(id) {
  if (!confirm("Delete this scope of work?")) return;
  state.sows = sows().filter(s => s.id !== id);
  save(); renderSows(); toast("Scope deleted", "warn");
}
function cycleSowStatus(id) {
  const s = sows().find(x => x.id === id);
  if (s.status === "Open") { s.status = "Closed"; s.closedAt = Date.now(); }
  else { s.status = "Open"; s.closedAt = null; }
  save(); renderSows();
  toast(s.status === "Closed" ? `Scope closed after ${fmtElapsed(sowElapsedMs(s))}` : "Scope reopened — timer running");
}

function renderSows() {
  const q = ui.sowSearch.toLowerCase();
  let rows = sows().filter(s =>
    (ui.sowStatus === "All" || s.status === ui.sowStatus) &&
    (!q || (s.number + " " + s.title + " " + s.client + " " + s.desc + " " + s.owner).toLowerCase().includes(q))
  );
  const k = ui.sowSort;
  rows.sort((a, b) => {
    if (k === "target" || k === "start") return ((a[k] || "9999") < (b[k] || "9999") ? -1 : 1);
    return String(a[k === "number" ? "number" : k] || "").localeCompare(String(b[k === "number" ? "number" : k] || ""));
  });

  document.getElementById("sowStatusChips").innerHTML = ["All", ...SOW_STATUSES].map(st => {
    const n = st === "All" ? sows().length : sows().filter(s => s.status === st).length;
    return `<button class="chip ${ui.sowStatus === st ? "active" : ""}" onclick="ui.sowStatus='${st}';renderSows()">
      ${st !== "All" ? `<span class="dot" style="background:${SOW_COLORS[st]}"></span>` : ""}${st} · ${n}</button>`;
  }).join("");

  const grid = document.getElementById("sowGrid");
  grid.innerHTML = rows.length ? rows.map(s => {
    const pct = sowProgress(s);
    const late = s.target && s.status !== "Closed" && daysUntil(s.target) < 0;
    const barColor = s.status === "Closed" ? "var(--green)" : late ? "var(--red)" : "var(--grad)";
    const open = s.status === "Open";
    return `<div class="sow-card" data-id="${s.id}" style="--sow-c:${SOW_COLORS[s.status]}" ondblclick="openSowModal('${s.id}')">
      <div class="sow-timer ${open ? "live" : "done"}" data-live="${open ? 1 : 0}" data-start="${sowStartMs(s)}"
           title="${open ? "Time open since " + fmtDate(s.start) : "Total time open (closed " + (s.closedAt ? new Date(s.closedAt).toLocaleDateString() : "—") + ")"}">
        <span class="lbl">${open ? "OPEN" : "TOTAL"}</span><span class="t">${fmtElapsed(sowElapsedMs(s))}</span>
      </div>
      <div class="sow-top">
        <div style="flex:1;padding-right:96px">
          ${s.number ? `<div class="sow-num">${esc(s.number)}</div>` : ""}
          <h4>${esc(s.title)}</h4>
        </div>
        <div class="kcard-menu">
          <button class="icon-btn" title="Edit" onclick="openSowModal('${s.id}')">✎</button>
          <button class="icon-btn" title="Delete" onclick="deleteSow('${s.id}')">🗑</button>
        </div>
      </div>
      ${s.client ? `<div class="sow-client">🏢 ${esc(s.client)}</div>` : ""}
      ${s.desc ? `<div class="sow-desc">${esc(s.desc)}</div>` : ""}
      <div class="sow-dates">
        <div><b>Start</b>${fmtDate(s.start)}</div>
        <div><b>Target</b><span style="${late ? "color:var(--red);font-weight:700" : ""}">${fmtDate(s.target)}${late ? " · " + (-daysUntil(s.target)) + "d late" : ""}</span></div>
      </div>
      ${pct !== null ? `<div class="sow-bar" title="${s.status === "Closed" ? "Closed" : pct + "% of schedule elapsed"}"><div style="width:${pct}%;background:${barColor}"></div></div>` : ""}
      <div class="sow-foot">
        <span class="pill" style="color:${SOW_COLORS[s.status]};background:color-mix(in srgb, ${SOW_COLORS[s.status]} 14%, transparent);cursor:pointer" title="Click to ${open ? "close" : "reopen"} this scope" onclick="cycleSowStatus('${s.id}')"><span class="dot"></span>${s.status}</span>
        ${refBadge("s", s.id)}
        ${s.owner ? `<span class="sow-owner" style="margin-left:auto"><span class="av">${esc(initials(s.owner))}</span>${esc(s.owner)}</span>` : ""}
      </div>
    </div>`;
  }).join("") : `<div class="empty-state" style="grid-column:1/-1"><div class="big">📋</div>No scopes of work yet. Add one with <b>＋ New Scope of Work</b>.</div>`;

  const openOnes = sows().filter(s => s.status === "Open");
  document.getElementById("cnt-sow").textContent = openOnes.length;
  const late = openOnes.filter(s => s.target && daysUntil(s.target) < 0).length;
  const oldest = openOnes.length ? Math.max(...openOnes.map(sowElapsedMs)) : 0;
  document.getElementById("sowStats").innerHTML =
    `<div class="stat"><b>${openOnes.length}</b> open</div>` +
    (oldest ? `<div class="stat"><b>${Math.floor(oldest / 86400000)}d</b> longest open</div>` : "") +
    (late ? `<div class="stat" style="border-color:var(--red)"><b style="color:var(--red)">${late}</b> past target</div>` : "");
}

/* =====================================================================
   NOTE LINKS — connect notes to projects, orders, POs, and other notes
   ===================================================================== */
const LINK_TYPES = {
  p: { name: "Project", icon: "◆", color: "var(--accent)" },
  o: { name: "Order", icon: "📦", color: "var(--orange)" },
  po: { name: "PO", icon: "🧾", color: "var(--teal)" },
  s: { name: "Scope of Work", icon: "📋", color: "var(--purple)" },
  n: { name: "Note", icon: "🔗", color: "var(--pink)" },
};
let modalLinks = [];

function linkLabel(l) {
  if (l.t === "p") { const x = state.projects.find(v => v.id === l.id); return x && x.title; }
  if (l.t === "o") { const x = state.orders.find(v => v.id === l.id); return x && (x.number ? x.number + " · " + x.item : x.item); }
  if (l.t === "po") { const x = state.pos.find(v => v.id === l.id); return x && (x.po + (x.vendor ? " · " + x.vendor : "")); }
  if (l.t === "s") { const x = sows().find(v => v.id === l.id); return x && ((x.number ? x.number + " · " : "") + x.title); }
  if (l.t === "n") { const x = state.notes.find(v => v.id === l.id); return x && x.title; }
}
function refNotes(t, id) { return state.notes.filter(n => (n.links || []).some(l => l.t === t && l.id === id)); }

function addModalLink(v) {
  if (!v) return;
  const i = v.indexOf(":");
  const l = { t: v.slice(0, i), id: v.slice(i + 1) };
  if (l.t === "n" && l.id === editingId) { toast("A note can't link to itself", "warn"); return; }
  if (modalLinks.some(x => x.t === l.t && x.id === l.id)) return;
  modalLinks.push(l);
  renderModalLinks();
}
function removeModalLink(i) { modalLinks.splice(i, 1); renderModalLinks(); }
function renderModalLinks() {
  const el = document.getElementById("f_linkchips");
  if (!el) return;
  el.innerHTML = modalLinks.map((l, i) => {
    const T = LINK_TYPES[l.t], lbl = linkLabel(l) || "(deleted)";
    return `<button type="button" class="chip" style="color:${T.color}" onclick="removeModalLink(${i})" title="Click to remove link">${T.icon} ${esc(lbl.length > 34 ? lbl.slice(0, 34) + "…" : lbl)} ✕</button>`;
  }).join("") || `<span style="font-size:11.5px;color:var(--text-faint)">No links yet — pick from the dropdown above</span>`;
}
function nlinkChips(n) {
  const chips = (n.links || []).map(l => {
    const lbl = linkLabel(l);
    if (!lbl) return "";
    const T = LINK_TYPES[l.t];
    return `<button class="nlink" style="color:${T.color};border-color:color-mix(in srgb, ${T.color} 40%, transparent)" onclick="gotoLink('${l.t}','${l.id}')" title="${T.name}: ${esc(lbl)}">${T.icon} ${esc(lbl.length > 30 ? lbl.slice(0, 30) + "…" : lbl)}</button>`;
  }).join("");
  return chips ? `<div class="nlinks">${chips}</div>` : "";
}

function flashEl(el) {
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 2400);
}
function gotoLink(t, id) {
  if (t === "n") {
    switchTab("notes");
    let el = document.querySelector(`.note-card[data-id="${id}"]`);
    if (!el) { ui.noteLabel = "All"; ui.noteSearch = ""; document.getElementById("noteSearch").value = ""; renderNotes(); el = document.querySelector(`.note-card[data-id="${id}"]`); }
    flashEl(el);
  } else if (t === "p") {
    switchTab("projects");
    let el = document.querySelector(`.kcard[data-id="${id}"]`);
    if (!el) { ui.projSearch = ""; ui.projPrio = "All"; document.getElementById("projSearch").value = ""; renderProjects(); el = document.querySelector(`.kcard[data-id="${id}"]`); }
    flashEl(el);
  } else if (t === "o") {
    switchTab("orders");
    let el = document.querySelector(`#ordersTableWrap tr[data-id="${id}"]`);
    if (!el) {
      ui.orderSearch = ""; ui.orderType = "All"; ui.orderPhase = "All";
      document.getElementById("orderSearch").value = ""; document.getElementById("showClosedOrders").checked = true;
      renderOrders(); el = document.querySelector(`#ordersTableWrap tr[data-id="${id}"]`);
    }
    flashEl(el);
  } else if (t === "s") {
    switchTab("sow");
    let el = document.querySelector(`.sow-card[data-id="${id}"]`);
    if (!el) { ui.sowSearch = ""; ui.sowStatus = "All"; document.getElementById("sowSearch").value = ""; renderSows(); el = document.querySelector(`.sow-card[data-id="${id}"]`); }
    flashEl(el);
  } else if (t === "po") {
    switchTab("pos");
    let el = document.querySelector(`#posTableWrap tr[data-id="${id}"]`);
    if (!el) {
      ui.poSearch = ""; ui.poFilter = "All";
      document.getElementById("poSearch").value = ""; document.getElementById("showDeliveredPos").checked = true;
      renderPos(); el = document.querySelector(`#posTableWrap tr[data-id="${id}"]`);
    }
    flashEl(el);
  }
}
function gotoNotesReferencing(t, id) {
  switchTab("notes");
  ui.noteLabel = "All"; ui.noteSearch = ""; document.getElementById("noteSearch").value = "";
  renderNotes();
  refNotes(t, id).forEach(n => flashEl(document.querySelector(`.note-card[data-id="${n.id}"]`)));
}
function refBadge(t, id) {
  const n = refNotes(t, id).length;
  return n ? `<button class="ref-btn" title="${n} linked note${n > 1 ? "s" : ""} — click to view" onclick="event.stopPropagation();gotoNotesReferencing('${t}','${id}')">🔗 ${n}</button>` : "";
}

   DAILY NOTES
   ===================================================================== */
function openNoteModal(id) {
  editingId = id || null;
  const n = id ? state.notes.find(x => x.id === id) : { title: "", body: "", date: todayStr(), labels: [], pinned: false, links: [] };
  modalLinks = [...(n.links || [])];
  const og = (list, t, getLbl) => list.length ? `<optgroup label="${LINK_TYPES[t].name}s">${list.map(x =>
    `<option value="${t}:${x.id}">${esc(String(getLbl(x)).slice(0, 55))}</option>`).join("")}</optgroup>` : "";
  openModal(id ? "Edit Note" : "New Note", `
    <div class="field-row">
      ${fld("Title", `<input id="f_title" value="${esc(n.title)}" placeholder="Note title">`)}
      ${fld("Date", `<input type="date" id="f_date" value="${esc(n.date)}">`)}
    </div>
    ${fld("Note", `<textarea id="f_body" rows="6" placeholder="What happened today…">${esc(n.body)}</textarea>`)}
    ${fld("Labels (comma-separated)", `<input id="f_labels" value="${esc((n.labels || []).join(", "))}" placeholder="e.g. production, meeting, follow-up">`)}
    ${fld("Linked items", `
      <select id="f_linkpick" onchange="addModalLink(this.value);this.value=''">
        <option value="">— link a project, order, PO, or another note —</option>
        ${og(state.projects, "p", x => x.title)}
        ${og(state.orders, "o", x => (x.number ? x.number + " · " : "") + x.item)}
        ${og(state.pos, "po", x => x.po + (x.vendor ? " · " + x.vendor : ""))}
        ${og(sows(), "s", x => (x.number ? x.number + " · " : "") + x.title)}
        ${og(state.notes.filter(x => x.id !== editingId), "n", x => x.title)}
      </select>
      <div class="chipbar" id="f_linkchips" style="margin-top:6px"></div>
    `)}
  `, () => {
    const title = val("f_title");
    if (!title && !val("f_body")) { toast("Add a title or note text", "warn"); return false; }
    const data = { title: title || "(untitled)", body: val("f_body"), date: val("f_date") || todayStr(), labels: val("f_labels").split(",").map(s => s.trim().toLowerCase().replace(/['"<>]/g, "")).filter(Boolean), links: [...modalLinks] };
    if (editingId) Object.assign(state.notes.find(x => x.id === editingId), data);

function deleteNote(id) {
  if (!confirm("Delete this note?")) return;
  state.notes = state.notes.filter(n => n.id !== id);
  save(); renderNotes(); toast("Note deleted", "warn");
}
function togglePin(id) {
  const n = state.notes.find(x => x.id === id);
  n.pinned = !n.pinned;
  save(); renderNotes();
}

function renderNotes() {
  const q = ui.noteSearch.toLowerCase();
  let rows = state.notes.filter(n =>
    (ui.noteLabel === "All" || (n.labels || []).includes(ui.noteLabel)) &&
    (!q || (n.title + " " + n.body + " " + (n.labels || []).join(" ")).toLowerCase().includes(q))
  );
  rows.sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if (ui.noteSort === "newest") return (b.date + b.created) < (a.date + a.created) ? -1 : 1;
    if (ui.noteSort === "oldest") return (a.date + a.created) < (b.date + b.created) ? -1 : 1;
    return a.title.localeCompare(b.title);
  });

  const allLabels = [...new Set(state.notes.flatMap(n => n.labels || []))].sort();
  document.getElementById("noteLabelChips").innerHTML = ["All", ...allLabels].map(l =>
    `<button class="chip ${ui.noteLabel === l ? "active" : ""}" onclick="ui.noteLabel='${esc(l)}';renderNotes()">
      ${l !== "All" ? `<span class="dot" style="background:${labelColor(l)}"></span>` : ""}${esc(l)}</button>`
  ).join("");

  const today = todayStr();
  const todayRows = rows.filter(n => n.date === today);
  const prevRows = rows.filter(n => n.date !== today);

  document.getElementById("todayGrid").innerHTML = todayRows.length
    ? todayRows.map(noteCardHtml).join("")
    : `<div class="empty-state" style="grid-column:1/-1;padding:22px 20px">
         <div class="big" style="font-size:26px">📝</div>
         ${rows.length ? "No notes dated today match this filter." : "Nothing logged today yet — use the box above."}
       </div>`;
  document.getElementById("prevGrid").innerHTML = prevRows.length
    ? prevRows.map(noteCardHtml).join("")
    : `<div class="empty-state" style="grid-column:1/-1;padding:22px 20px">No earlier notes${ui.noteSearch || ui.noteLabel !== "All" ? " match this filter" : ""}.</div>`;

  document.getElementById("todayNoteCount").textContent = todayRows.length;
  document.getElementById("prevNoteCount").textContent = prevRows.length;
  document.getElementById("todayDateLbl").textContent =
    new Date(today + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  document.getElementById("cnt-notes").textContent = state.notes.length;
}

      <div class="note-head">
        <h4>${esc(n.title)}</h4>
        <div class="kcard-menu" style="opacity:1">

    </div>`;

  state.notes.push({

function todos() { return state.todos || (state.todos = []); }
function addTodo() {
  const inp = document.getElementById("todoInput");
  const text = inp.value.trim();
  if (!text) return;
  todos().unshift({ id: uid(), text, done: false, created: Date.now() });
  inp.value = "";
  save(); renderTodos();
  inp.focus();
}
function toggleTodo(id) {
  const t = todos().find(x => x.id === id);
  t.done = !t.done;
  save(); renderTodos();
}
function deleteTodo(id) {
  state.todos = todos().filter(t => t.id !== id);
  save(); renderTodos();
}
function clearDoneTodos() {
  const n = todos().filter(t => t.done).length;
  if (!n) { toast("No completed to-dos to clear", "warn"); return; }
  if (!confirm(`Remove ${n} completed to-do${n > 1 ? "s" : ""}?`)) return;
  state.todos = todos().filter(t => !t.done);
  save(); renderTodos(); toast("Completed to-dos cleared");
}
function editTodoStart(id) {
  const span = document.querySelector(`.todo-item[data-id="${id}"] .txt`);
  const t = todos().find(x => x.id === id);
  if (!span || !t) return;
  const inp = document.createElement("input");
  inp.value = t.text;
  inp.style.flex = "1"; inp.style.minWidth = "0";
  span.replaceWith(inp);
  inp.focus(); inp.select();
  const finish = () => { const v = inp.value.trim(); if (v) t.text = v; save(); renderTodos(); };
  inp.addEventListener("blur", finish);
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") inp.blur();
    if (e.key === "Escape") { inp.removeEventListener("blur", finish); renderTodos(); }
  });
}
function renderTodos() {
  const list = [...todos()].sort((a, b) => a.done !== b.done ? (a.done ? 1 : -1) : b.created - a.created);
  document.getElementById("todoCount").textContent = todos().filter(t => !t.done).length;
  document.getElementById("todoList").innerHTML = list.length ? list.map(t => `
    <div class="todo-item ${t.done ? "done" : ""}" data-id="${t.id}">
      <input type="checkbox" class="todo-check" ${t.done ? "checked" : ""} onchange="toggleTodo('${t.id}')">
      <span class="txt" title="Double-click to edit" ondblclick="editTodoStart('${t.id}')">${esc(t.text)}</span>
      <button class="icon-btn" title="Delete" onclick="deleteTodo('${t.id}')">🗑</button>
    </div>`).join("") : `<div class="todo-empty">Nothing to do — add a task above</div>`;
}

/* =====================================================================
   AUTO-BACKUP — writes a JSON file on every change (Chrome/Edge).
   The file handle is remembered in IndexedDB; after a browser restart
   you click the 💾 button once to re-grant write access.
   ===================================================================== */
const REV = "rev 1.0.0";   // site port of local build 2026-10-09-o
const LS_BACKUP_TS = "atlas_ops_last_backup";
let backupHandle = null, backupTimer = null, backupPaused = false, backupError = "";

/* One shared connection, reused. Opening a new one per call leaked handles
   and could block the upgrade transaction after site data is cleared. */
let idbConn = null;
function idbOpen() {
  if (idbConn) return Promise.resolve(idbConn);
  return new Promise((res, rej) => {
    const r = indexedDB.open("atlas_ops_fs", 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
    r.onsuccess = () => { idbConn = r.result; idbConn.onclose = () => { idbConn = null; }; res(idbConn); };
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error("IndexedDB upgrade blocked"));
  });
}
async function idbSet(k, v) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(v, k);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction("kv", "readonly").objectStore("kv").get(k);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}

function scheduleBackup() {
  if (!backupHandle || backupPaused) return;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(writeBackup, 1200);
}

/* Writes are serialized: overlapping createWritable() calls on the same handle
   throw NoModificationAllowedError (the file is locked by the open stream),
   which is what was flipping auto-backup straight back to "paused". */
let writeInFlight = false, writeQueued = false;

async function writeBackup() {
  clearTimeout(backupTimer);
  if (!backupHandle || backupPaused) return;
  if (writeInFlight) { writeQueued = true; return; }

  /* GUARD 1 — never write untouched sample data over a backup file. */
  if (pristineSeed) { console.warn("Backup skipped: state is untouched seed data"); return; }

  /* GUARD 2 — never silently shrink a backup. If the file on disk holds
     substantially more than memory, something is wrong: stop and ask. */
  try {
    const f = await backupHandle.getFile();
    if (f.size > 2) {
      const onDisk = JSON.parse(await f.text());
      if (onDisk && onDisk.projects) {
        const a = countOf(onDisk), b = countOf(state);
        if (a.total >= 5 && b.total < a.total * 0.6) {
          backupPaused = true;
          updateBackupLabel();
          const load = confirm(
            `⚠ Backup safety stop\n\n` +
            `The backup file holds MORE than what's on screen:\n` +
            `   file:   ${countSummary(a)}\n` +
            `   screen: ${countSummary(b)}\n\n` +
            `Writing now would destroy data. Load the file's contents instead?\n\n` +
            `OK = load the file (recommended)   ·   Cancel = leave everything untouched`);
          if (load) {
            state = onDisk; pristineSeed = false;
            document.documentElement.dataset.theme = state.theme || "dark";
            localStorage.setItem(LS_KEY, JSON.stringify(state));
            renderAll(); backupPaused = false;
            toast("Loaded backup file contents");
            updateBackupLabel();
          }
          return;
        }
      }
    }
  } catch (e) { /* unreadable or not JSON — fall through to the normal write */ }

  writeInFlight = true;
  let lastErr = null;
  const delays = [0, 500, 1500, 3500];   // 4 attempts with backoff — beats transient file locks
  for (let i = 0; i < delays.length; i++) {
    if (delays[i]) await new Promise(r => setTimeout(r, delays[i]));
    try {
      const perm = await backupHandle.queryPermission({ mode: "readwrite" });
      if (perm !== "granted") throw Object.assign(new Error("queryPermission returned '" + perm + "'"), { name: "NotAllowedError" });
      const w = await backupHandle.createWritable();
      await w.write(JSON.stringify(state, null, 2));
      await w.close();
      localStorage.setItem(LS_BACKUP_TS, String(Date.now()));
      backupError = ""; lastErr = null;
      break;
    } catch (e) {
      lastErr = e;
      console.error("Backup write attempt " + (i + 1) + " failed:", e.name, e.message, e);
    }
  }
  writeInFlight = false;
  if (lastErr) {
    backupPaused = true; writeQueued = false;
    backupError = lastErr.name + ": " + lastErr.message;
    toast("Auto-backup failed — " + lastErr.name, "err");
    showBackupDiagnostics(lastErr);
  }
  updateBackupLabel();
  if (writeQueued && !backupPaused) { writeQueued = false; writeBackup(); }
}

/* Full diagnostic readout — so a failure tells us exactly what Chrome objected to. */
async function showBackupDiagnostics(err) {
  let perm = "n/a", fileInfo = "n/a";
  try { if (backupHandle) perm = await backupHandle.queryPermission({ mode: "readwrite" }); } catch (e) { perm = "query threw " + e.name; }
  try { const f = await backupHandle.getFile(); fileInfo = f.name + " · " + f.size + " bytes"; } catch (e) { fileInfo = "getFile() threw " + e.name + ": " + e.message; }
  const rows = [
    ["Error", err ? err.name : "—"],
    ["Message", err ? err.message : "—"],
    ["Page protocol", location.protocol],
    ["Write permission", String(perm)],
    ["Backup file", fileInfo],
    ["API available", ("showSaveFilePicker" in window) ? "yes" : "no"],
    ["Revision", REV],
  ];
  openModal("Auto-backup problem", `
    <div style="font-size:12.5px;color:var(--text-dim);line-height:1.5">
      The file write was rejected. Details below — send these to get it sorted.
      Your data is still saved in this browser; nothing was lost.
    </div>
    <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
      ${rows.map(([k, v]) => `<div style="display:flex;gap:10px;padding:7px 11px;border-bottom:1px solid var(--border);font-size:12px">
        <b style="min-width:118px;color:var(--text-dim);font-weight:700">${k}</b>
        <span class="mono" style="word-break:break-word;flex:1">${esc(String(v))}</span></div>`).join("")}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="closeModal();backupClick(true)">Pick a different file</button>
      <button class="btn" onclick="copyDiag()">Copy details</button>
      <button class="btn" onclick="closeModal();document.getElementById('exportBtn').click()">Download backup now</button>
    </div>
    <div style="font-size:12px;color:var(--text-dim);line-height:1.5">
      <b>Common cause:</b> the backup file sits in a folder synced by OneDrive/Dropbox, or is open in
      another program — both hold a lock Chrome can't write through. Try picking a file in a plain
      local folder (e.g. Documents), not a synced one.
    </div>
  `, () => { backupPaused = false; backupError = ""; writeBackup(); });
  document.getElementById("modalSave").textContent = "Retry write";
  window.__diag = rows.map(r => r.join(": ")).join("\n");
}
function copyDiag() {
  navigator.clipboard.writeText(window.__diag || "").then(() => toast("Diagnostics copied"), () => toast("Copy failed", "err"));
}
/* Adopt a handle as the backup target — reading it first, always. */
async function adoptBackupFile(h, { announce = true } = {}) {
  let data = null, file = null, text = "";
  try { file = await h.getFile(); text = await file.text(); } catch (e) { text = ""; }
  try { data = JSON.parse(text); } catch (e) { data = null; }

  if (data && data.projects) {
    const inFile = countOf(data), inApp = countOf(state);
    if (inFile.total > 0) {
      const msg = `"${file.name}" contains:\n   ${countSummary(inFile)}\n\n` +
        `Currently on screen:\n   ${countSummary(inApp)}\n\n` +
        `Load the file's contents into the dashboard?\n` +
        `OK = load the file   ·   Cancel = keep what's on screen`;
      if (confirm(msg)) {
        data.sows = data.sows || []; data.todos = data.todos || [];
        state = data; pristineSeed = false;
        document.documentElement.dataset.theme = state.theme || "dark";
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        mirrorToIdb(); renderAll();
        toast("Loaded " + inFile.total + " items from backup");
      } else if (countOf(state).total < inFile.total) {
        toast("Kept screen data — file will be overwritten on the next change", "warn");
      }
    }
  } else if (text.trim()) {
    if (!confirm(`"${file.name}" isn't an Atlas Ops backup file.\n\nUse it as the backup target anyway? Its current contents will be replaced.`)) return false;
  }

  backupHandle = h;
  try { await idbSet("backupHandle", h); } catch (e) { console.error("Couldn't remember handle", e); }
  backupPaused = false; backupError = "";
  updateBackupLabel();
  if (!pristineSeed) await writeBackup();
  if (announce) toast("Auto-backup linked to " + (file ? file.name : "file"));
  return true;
}

/* Startup: storage empty but the linked file has data → offer it. */
async function maybeRestoreFromBackup() {
  if (!backupHandle || !pristineSeed) return;
  try {
    const file = await backupHandle.getFile();
    const data = JSON.parse(await file.text());
    const c = countOf(data);
    if (data.projects && c.total) {
      if (confirm(`Browser storage was empty, but your backup file has data:\n   ${countSummary(c)}\n\nRestore it?`)) {
        data.sows = data.sows || []; data.todos = data.todos || [];
        state = data; pristineSeed = false;
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        renderAll();
        document.documentElement.dataset.theme = state.theme || "dark";
        toast("Restored from backup file");
      }
    }
  } catch (e) { /* empty or brand-new backup file — nothing to restore */ }
}
/* First-run / re-link chooser — loading an existing file is the default path. */
function openBackupChooser() {
  openModal("Auto-backup", `
    <div style="font-size:12.5px;color:var(--text-dim);line-height:1.55">
      Pick the file this dashboard keeps in sync. Choosing an existing backup
      <b>loads it first</b> — it is never blanked.
    </div>
    <button class="btn btn-primary" style="justify-content:center;padding:12px" onclick="closeModal();backupUseExisting()">
      📂 Open an existing backup file
    </button>
    <div style="font-size:11.5px;color:var(--text-dim);margin-top:-6px">
      Loads its contents into the dashboard, then keeps writing to it.
    </div>
    <button class="btn" style="justify-content:center;padding:12px" onclick="closeModal();backupCreateNew()">
      ✚ Start a new backup file
    </button>
    <div style="font-size:11.5px;color:var(--text-dim);margin-top:-6px">
      For a fresh file. If you pick one that already has data, it's loaded rather than overwritten.
    </div>
  `, null);
  document.getElementById("modalSave").style.display = "none";
}

async function backupUseExisting() {
  try {
    const [h] = await window.showOpenFilePicker({
      multiple: false,
      types: [{ description: "JSON backup", accept: { "application/json": [".json"] } }],
    });
    const p = await h.requestPermission({ mode: "readwrite" });
    if (p !== "granted") { toast("Write access denied — file not linked", "warn"); return; }
    await adoptBackupFile(h);
  } catch (e) { if (e.name !== "AbortError") toast("Couldn't open file: " + e.message, "err"); }
}

async function backupCreateNew() {
  try {
    const h = await window.showSaveFilePicker({
      suggestedName: "atlas-ops-autobackup.json",
      types: [{ description: "JSON backup", accept: { "application/json": [".json"] } }],
    });
    await adoptBackupFile(h);   // reads it first even here — picking an existing file loads it
  } catch (e) { if (e.name !== "AbortError") toast("Backup setup failed: " + e.message, "err"); }
}

async function backupClick(forcePick) {
  if (!("showSaveFilePicker" in window)) { document.getElementById("exportBtn").click(); return; }
  if (!backupHandle || forcePick) { openBackupChooser(); return; }
  try {
    if (backupHandle && !forcePick) {
      const p = await backupHandle.requestPermission({ mode: "readwrite" });
      if (p === "granted") {
        backupPaused = false; backupError = "";
        await maybeRestoreFromBackup();
        await writeBackup();
        updateBackupLabel();
        if (!backupPaused) toast("Auto-backup active");
        else if (confirm("Couldn't write to the saved backup file (" + backupError + ").\n\nPick a backup file again?")) return backupClick(true);
        return;
      }
      if (!confirm("Chrome didn't grant write access to the saved backup file.\n\nChoose a backup file again?")) {
        updateBackupLabel(); return;
      }
    }
    openBackupChooser();
  } catch (e) {
    if (e.name !== "AbortError") toast("Backup setup failed: " + e.message, "err");
  }
  updateBackupLabel();
}
function updateBackupLabel() {
  const el = document.getElementById("backupStatus");
  const ts = Number(localStorage.getItem(LS_BACKUP_TS) || 0);
  el.style.borderColor = ""; el.style.color = "";
  if (!("showSaveFilePicker" in window)) {
    el.textContent = "💾 Export manually";
    el.title = "Auto-backup needs Chrome or Edge — click to download a JSON backup";
  } else if (!backupHandle) {
    el.textContent = "💾 Set up auto-backup";
    el.title = "Click to choose a backup file — every change will be saved to it automatically";
    el.style.borderColor = "var(--yellow)";
  } else if (backupPaused) {
    el.textContent = "💾 Click to resume backup";
    el.title = (backupError ? "Last error — " + backupError + "\n" : "") +
      "Click to re-grant write access to your backup file. Shift+click to pick a different file.";
    el.style.borderColor = "var(--yellow)"; el.style.color = "var(--yellow)";
  } else {
    el.textContent = "💾 Backed up " + (ts ? new Date(ts).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—");
    el.title = "Auto-backup active — last write shown. Click to force a backup now.\nShift+click to pick a different file. " + REV;
  }
}
/* If localStorage came up empty but the IndexedDB mirror has data, offer it. */
async function maybeRestoreFromIdb() {
  if (!pristineSeed) return;
  try {
    const snap = await idbGet("snapshot");
    if (snap && snap.data && snap.data.projects) {
      const n = snap.data.projects.length + snap.data.orders.length + snap.data.pos.length + snap.data.notes.length;
      if (n && confirm(`Browser storage was empty, but a local snapshot from ${new Date(snap.ts).toLocaleString()} has ${n} items.\n\nRestore it?`)) {
        state = snap.data; pristineSeed = false;
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        renderAll();
        document.documentElement.dataset.theme = state.theme || "dark";
        toast("Restored from local snapshot");
      }
    }
  } catch (e) { console.error("IDB restore check failed", e); }
}

async function initBackup() {
  console.log("Ops Dashboard — " + REV);
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  await maybeRestoreFromIdb();
  if ("showSaveFilePicker" in window) {
    try {
      backupHandle = await idbGet("backupHandle");
      if (backupHandle) {
        const p = await backupHandle.queryPermission({ mode: "readwrite" });
        if (p === "granted") { backupPaused = false; await maybeRestoreFromBackup(); await writeBackup(); }
        else { backupPaused = true; toast("Click 💾 to resume auto-backup", "warn"); }
      }
    } catch (e) { console.error("Backup init failed", e); }
  }
  updateBackupLabel();
}
document.getElementById("backupStatus").addEventListener("click", e => {
  if (e.shiftKey) return backupClick(true);           // Shift+click = pick a different backup file
  if (backupHandle && !backupPaused) return writeBackup();
  backupClick();
});
initBackup();

function tickClock() {
  const now = new Date();
  document.getElementById("clock").innerHTML =
    now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }) +
    "<br><b>" + now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) + "</b>";
}
setInterval(tickClock, 15000);

function renderAll() { renderProjects(); renderOrders(); renderPos(); renderSows(); renderNotes(); renderTodos(); }
document.getElementById("rev").textContent = REV;

/* =====================================================================
   DOT FIELD — rolling wave + cursor hot spot (from atlasclark.github.io)
   Dashboard-specific changes vs. the site:
     • full-window, fixed behind the UI; glow shows through gaps between cards
     • capped at ~30fps and fully paused while the tab is hidden
     • slightly subtler base alpha so dense tables stay readable
     • respects prefers-reduced-motion; on/off toggle saved with your data
   ===================================================================== */
const fx = (() => {
  const cv = document.getElementById("field"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const GAP = 22, FRAME_MS = 33;
  let w = 0, h = 0, mx = -1e4, my = -1e4, t = 0, raf = 0, last = 0, on = false;
  let dot = "236,237,230", hot = "208,221,43";

  const readColors = () => {
    const cs = getComputedStyle(document.documentElement);
    dot = cs.getPropertyValue("--dot").trim() || dot;
    hot = cs.getPropertyValue("--dot-hot").trim() || hot;
  };
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (let y = GAP / 2; y < h; y += GAP) for (let x = GAP / 2; x < w; x += GAP) {
      const wave = Math.sin(x * 0.012 + t) * Math.cos(y * 0.016 - t * 0.7);
      const heat = Math.max(0, 1 - Math.hypot(x - mx, y - my) / 160);
      const base = 0.06 + 0.08 * (wave + 1) / 2;
      ctx.fillStyle = heat > 0.02 ? `rgba(${hot},${Math.min(1, base + heat * 0.9)})` : `rgba(${dot},${base})`;
      ctx.beginPath(); ctx.arc(x, y, 1 + heat * 1.6 + (wave > 0.82 ? 0.5 : 0), 0, 6.2832); ctx.fill();
    }
  }
  function loop(ts) {
    raf = 0;
    if (!on || document.hidden) return;
    if (ts - last >= FRAME_MS) { last = ts; t += 0.016; draw(); }
    raf = requestAnimationFrame(loop);
  }
  const start = () => { if (on && !raf && !document.hidden) raf = requestAnimationFrame(loop); };

  addEventListener("resize", () => { size(); draw(); });
  addEventListener("pointermove", e => { mx = e.clientX; my = e.clientY; }, { passive: true });
  document.addEventListener("pointerleave", () => { mx = my = -1e4; });
  addEventListener("blur", () => { mx = my = -1e4; });
  document.addEventListener("visibilitychange", start);
  new MutationObserver(() => { readColors(); draw(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  function set(enabled) {
    on = enabled && !reduce;
    document.body.classList.toggle("fx-off", !on);
    const b = document.getElementById("fxBtn");
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    b.title = reduce ? "Animated background disabled (reduced-motion is on in your OS)"
                     : (on ? "Animated background: on" : "Animated background: off");
    if (on) { readColors(); size(); draw(); start(); }
    else if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  return { set };
})();
document.getElementById("fxBtn").addEventListener("click", () => {
  state.fx = state.fx === false;   // undefined/true → false, false → true
  localStorage.setItem(LS_KEY, JSON.stringify(state));   // UI pref only — no backup write
  fx.set(state.fx !== false);
});
/* Show the wordmark when it loads; otherwise keep the text fallback. */
(() => {
  const im = new Image();
  im.onload = () => document.documentElement.classList.add("has-wm");
  im.src = "../../assets/brand/wordmark.png";
})();
document.documentElement.dataset.theme = state.theme || "dark";
tickClock();
renderAll();
fx.set(state.fx !== false);   // after theme is applied so the field reads the right colors
</script>
</body>
</html>
